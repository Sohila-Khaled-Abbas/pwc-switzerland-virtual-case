    <text x="25" y="160" fill="#94A3B8" font-family="sans-serif" font-size="10">• [At-Risk MRR] ($139.1K / mo)</text>
    <text x="25" y="174" fill="#94A3B8" font-family="sans-serif" font-size="10">• [Annualized Revenue Loss] ($1.67M)</text>

    <rect x="15" y="192" width="250" height="60" rx="6" fill="#2D1C16"/>
    <text x="25" y="214" fill="#FB923C" font-family="sans-serif" font-size="11" font-weight="bold">Contract &amp; Tenure Elasticity</text>
    <text x="25" y="232" fill="#94A3B8" font-family="sans-serif" font-size="10">• Month-to-Month Churn: 42.7%</text>
    <text x="25" y="246" fill="#94A3B8" font-family="sans-serif" font-size="10">• 2-Year Contract Churn: 2.8%</text>

    <rect x="15" y="264" width="250" height="50" rx="6" fill="#2D1C16"/>
    <text x="25" y="286" fill="#FB923C" font-family="sans-serif" font-size="11" font-weight="bold">Product Friction Drivers</text>
    <text x="25" y="304" fill="#94A3B8" font-family="sans-serif" font-size="10">• Fiber Optic Tech Tickets Spike</text>
