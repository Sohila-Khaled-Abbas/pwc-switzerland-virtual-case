    <text x="15" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">📞 Task 1: Telephony Operations</text>
    
    <rect x="15" y="48" width="250" height="60" rx="6" fill="#132337"/>
    <text x="25" y="70" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">Call Resolution &amp; Service</text>
    <text x="25" y="88" fill="#94A3B8" font-family="sans-serif" font-size="10">• [Answer Rate %] (81.08%)</text>
    <text x="25" y="102" fill="#94A3B8" font-family="sans-serif" font-size="10">• [Resolution Rate %] (89.94%)</text>

    <rect x="15" y="120" width="250" height="60" rx="6" fill="#132337"/>
    <text x="25" y="142" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">Speed &amp; Capacity</text>
    <text x="25" y="160" fill="#94A3B8" font-family="sans-serif" font-size="10">• [Avg Speed of Answer] (67.5s)</text>
    <text x="25" y="174" fill="#94A3B8" font-family="sans-serif" font-size="10">• [Avg Talk Duration] (224.9s)</text>

    <rect x="15" y="192" width="250" height="60" rx="6" fill="#132337"/>
    <text x="25" y="214" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">Customer Experience (CSAT)</text>
