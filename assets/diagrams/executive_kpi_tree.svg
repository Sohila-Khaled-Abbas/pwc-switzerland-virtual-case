    <rect x="15" y="48" width="250" height="60" rx="6" fill="#132B21"/>
    <text x="25" y="70" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="bold">Workforce Representation</text>
    <text x="25" y="88" fill="#94A3B8" font-family="sans-serif" font-size="10">• [Female Headcount %] (41.0%)</text>
    <text x="25" y="102" fill="#94A3B8" font-family="sans-serif" font-size="10">• [Male Headcount %] (59.0%)</text>

    <rect x="15" y="120" width="250" height="60" rx="6" fill="#132B21"/>
    <text x="25" y="142" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="bold">Promotion Parity Velocity</text>
    <text x="25" y="160" fill="#94A3B8" font-family="sans-serif" font-size="10">• [Total Promotions FY21] (51)</text>
    <text x="25" y="174" fill="#94A3B8" font-family="sans-serif" font-size="10">• [Female Promotion Share] (35.3%)</text>

    <rect x="15" y="192" width="250" height="60" rx="6" fill="#132B21"/>
    <text x="25" y="214" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="bold">Turnover &amp; Attrition</text>
    <text x="25" y="232" fill="#94A3B8" font-family="sans-serif" font-size="10">• [Turnover Count FY20] (47)</text>
    <text x="25" y="246" fill="#94A3B8" font-family="sans-serif" font-size="10">• [Turnover Rate %] (9.40%)</text>

    <rect x="15" y="264" width="250" height="50" rx="6" fill="#132B21"/>
    <text x="25" y="286" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="bold">Executive Broken Rung</text>
    <text x="25" y="304" fill="#94A3B8" font-family="sans-serif" font-size="10">• Sr Manager &amp; Exec Cliff</text>
  </g>

  <!-- Connecting Tree Lines -->
  <path d="M 500 175 L 500 195 L 180 195 L 180 220" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <path d="M 500 175 L 500 220" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <path d="M 500 175 L 500 195 L 820 195 L 820 220" fill="none" stroke="#64748B" stroke-width="1.5"/>

</svg>
