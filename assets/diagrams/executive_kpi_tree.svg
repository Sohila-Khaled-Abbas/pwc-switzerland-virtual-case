<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#03050A"/>
    </linearGradient>
    <linearGradient id="pwcBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D04A02"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bgTree)"/>
  <rect x="20" y="20" width="960" height="560" rx="12" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title -->
  <rect x="40" y="35" width="920" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="35" width="6" height="60" rx="3" fill="url(#pwcBar2)"/>
  <text x="60" y="60" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold">PwC Switzerland | Executive KPI Decomposition Hierarchy</text>
  <text x="60" y="80" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">3 Domain Pillars • 30+ VertiPaq DAX Formulations • Strategic Business Outcomes</text>

  <!-- Root Node -->
  <g transform="translate(360, 115)">
    <rect width="280" height="60" rx="8" fill="#0F172A" stroke="#D04A02" stroke-width="2"/>
