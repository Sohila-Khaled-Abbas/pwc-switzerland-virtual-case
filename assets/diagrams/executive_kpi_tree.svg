    <text x="25" y="246" fill="#94A3B8" font-family="sans-serif" font-size="10">• [CSAT Satisfaction %] (54.6%)</text>

    <rect x="15" y="264" width="250" height="50" rx="6" fill="#132337"/>
    <text x="25" y="286" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">Agent Performance Index</text>
    <text x="25" y="304" fill="#94A3B8" font-family="sans-serif" font-size="10">• 2D Agent Quadrant Ranking</text>
