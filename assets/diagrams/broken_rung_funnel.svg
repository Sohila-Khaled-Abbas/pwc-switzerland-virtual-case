<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFunnel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="pwcRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D04A02"/>
      <stop offset="100%" stop-color="#FF5A1F"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="950" height="560" fill="url(#bgFunnel)"/>
  <rect x="20" y="20" width="910" height="520" rx="12" fill="none" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Title Ribbon -->
  <rect x="40" y="35" width="870" height="60" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="40" y="35" width="6" height="60" rx="3" fill="url(#pwcRed)"/>
  <text x="60" y="60" fill="#FFFFFF" font-family="-apple-system, Segoe UI, sans-serif" font-size="17" font-weight="bold">Pharma Group AG | Executive "Broken Rung" Gender Progression Funnel</text>
  <text x="60" y="80" fill="#9CA3AF" font-family="-apple-system, Segoe UI, sans-serif" font-size="12">Task 3 Diversity &amp; Inclusion Analysis • Diagnostic Funnel from Entry-Level Parity to C-Suite Underrepresentation (500 Personnel)</text>

  <!-- Funnel Bars -->
  <!-- Level 6: Junior Officer -->
  <g transform="translate(60, 115)">
    <rect width="830" height="48" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <!-- Female fill: 51.8% of 830 = 430px -->
    <rect width="430" height="48" rx="6" fill="#10B981" fill-opacity="0.85"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">6 - Junior Officer (Entry Level)</text>
    <text x="320" y="30" fill="#ECFDF5" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">51.8% Female (100 / 193)</text>
    <text x="620" y="30" fill="#10B981" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="bold">✅ Parity Benchmark Met</text>
  </g>

  <!-- Level 5: Senior Officer -->
  <g transform="translate(60, 175)">
    <rect width="830" height="48" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <!-- Female fill: 39.8% of 830 = 330px -->
    <rect width="330" height="48" rx="6" fill="#10B981" fill-opacity="0.65"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">5 - Senior Officer</text>
    <text x="320" y="30" fill="#ECFDF5" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">39.8% Female (35 / 88)</text>
    <text x="620" y="30" fill="#94A3B8" font-family="-apple-system, Segoe UI, sans-serif" font-size="12">Healthy Mid-Tier Pipeline</text>
  </g>

  <!-- Level 4: Manager -->
  <g transform="translate(60, 235)">
    <rect width="830" height="48" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <!-- Female fill: 34.3% of 830 = 285px -->
    <rect width="285" height="48" rx="6" fill="#F59E0B" fill-opacity="0.80"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">4 - Manager</text>
    <text x="320" y="30" fill="#FEF3C7" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">34.3% Female (24 / 70)</text>
    <text x="620" y="30" fill="#F59E0B" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="bold">⚠️ Emerging Drop-off (-5.5%)</text>
  </g>

  <!-- Level 3: Senior Manager (THE BROKEN RUNG) -->
  <g transform="translate(60, 295)">
    <rect width="830" height="48" rx="6" fill="#2E1010" stroke="#EF4444" stroke-width="1.5"/>
    <!-- Female fill: 14.6% of 830 = 121px -->
    <rect width="121" height="48" rx="6" fill="#EF4444" fill-opacity="0.90"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">3 - Senior Manager</text>
    <text x="320" y="30" fill="#FEE2E2" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">14.6% Female (6 / 41)</text>
    <text x="620" y="30" fill="#F87171" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="bold">🚨 CRITICAL BROKEN RUNG (-19.7%)</text>
  </g>

  <!-- Level 2: Director -->
  <g transform="translate(60, 355)">
    <rect width="830" height="48" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <!-- Female fill: 12.5% of 830 = 104px -->
    <rect width="104" height="48" rx="6" fill="#EF4444" fill-opacity="0.75"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">2 - Director</text>
    <text x="320" y="30" fill="#FEE2E2" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">12.5% Female (4 / 32)</text>
    <text x="620" y="30" fill="#F87171" font-family="-apple-system, Segoe UI, sans-serif" font-size="12">Severe Leadership Deficit</text>
  </g>

  <!-- Level 1: Executive Board -->
  <g transform="translate(60, 415)">
    <rect width="830" height="48" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <!-- Female fill: 20.0% of 830 = 166px -->
    <rect width="166" height="48" rx="6" fill="#DC2626" fill-opacity="0.95"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">1 - Executive (Board &amp; C-Suite)</text>
    <text x="320" y="30" fill="#FEE2E2" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="bold">20.0% Female (2 / 10)</text>
    <text x="620" y="30" fill="#F87171" font-family="-apple-system, Segoe UI, sans-serif" font-size="12">Board Parity Target: &gt; 35%</text>
  </g>

  <!-- Summary Footer Card -->
  <g transform="translate(60, 480)">
    <rect width="830" height="36" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="20" y="23" fill="#94A3B8" font-family="-apple-system, Segoe UI, sans-serif" font-size="11.5">
      Workforce Total: <tspan fill="#FFFFFF" font-weight="bold">500 Personnel</tspan> • Women: <tspan fill="#10B981" font-weight="bold">205 (41.0%)</tspan> • Men: <tspan fill="#38BDF8" font-weight="bold">295 (59.0%)</tspan> • Promotion Equity Index: <tspan fill="#EF4444" font-weight="bold">0.78 (Male Bias)</tspan>
    </text>
  </g>

</svg>
