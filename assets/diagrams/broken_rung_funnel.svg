<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFunnel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="pwcRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D04A02"/>
      <stop offset="100%" stop-color="#FF5A1F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="950" height="550" fill="url(#bgFunnel)"/>
  <rect x="20" y="20" width="910" height="510" rx="12" fill="none" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Title -->
  <rect x="40" y="35" width="870" height="60" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="40" y="35" width="6" height="60" rx="3" fill="url(#pwcRed)"/>
  <text x="60" y="60" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="17" font-weight="bold">Pharma Group AG | Executive "Broken Rung" Gender Progression Funnel</text>
  <text x="60" y="80" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="12">Task 3 Diversity &amp; Inclusion Analysis • Diagnostic Funnel from Entry-Level Parity to C-Suite Underrepresentation</text>

  <!-- Funnel Bars -->
  <!-- Level 6: Junior Officer -->
  <g transform="translate(60, 120)">
    <rect width="830" height="50" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <!-- Female fill -->
    <rect width="443" height="50" rx="6" fill="#10B981" fill-opacity="0.85"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">6 - Junior Officer (Entry Level)</text>
    <text x="360" y="30" fill="#ECFDF5" font-family="sans-serif" font-size="13" font-weight="bold">53.4% Female (109 / 204)</text>
    <text x="700" y="30" fill="#94A3B8" font-family="sans-serif" font-size="12">Parity Benchmark Met</text>
  </g>

  <!-- Level 5: Senior Officer -->
  <g transform="translate(60, 185)">
    <rect width="830" height="50" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <rect width="387" height="50" rx="6" fill="#10B981" fill-opacity="0.7"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">5 - Senior Officer</text>
    <text x="310" y="30" fill="#ECFDF5" font-family="sans-serif" font-size="13" font-weight="bold">46.7% Female (42 / 90)</text>
    <text x="700" y="30" fill="#94A3B8" font-family="sans-serif" font-size="12">Healthy Talent Pipeline</text>
  </g>

  <!-- Level 4: Manager -->
  <g transform="translate(60, 250)">
    <rect width="830" height="50" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <rect width="303" height="50" rx="6" fill="#F59E0B" fill-opacity="0.8"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">4 - Manager</text>
    <text x="230" y="30" fill="#FEF3C7" font-family="sans-serif" font-size="13" font-weight="bold">36.6% Female (30 / 82)</text>
    <text x="700" y="30" fill="#F59E0B" font-family="sans-serif" font-size="12">⚠️ Early Drop-off Point</text>
  </g>

  <!-- Level 3: Senior Manager (THE BROKEN RUNG) -->
  <g transform="translate(60, 315)">
    <rect width="830" height="50" rx="6" fill="#2E1010" stroke="#EF4444" stroke-width="1.5"/>
    <rect width="148" height="50" rx="6" fill="#EF4444" fill-opacity="0.9"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">3 - Senior Manager</text>
    <text x="90" y="30" fill="#FEE2E2" font-family="sans-serif" font-size="13" font-weight="bold">17.9% (10 / 56)</text>
    <text x="580" y="30" fill="#F87171" font-family="sans-serif" font-size="12" font-weight="bold">🚨 CRITICAL BROKEN RUNG (-18.7% Drop)</text>
  </g>

  <!-- Level 2: Director -->
  <g transform="translate(60, 380)">
    <rect width="830" height="50" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <rect width="112" height="50" rx="6" fill="#EF4444" fill-opacity="0.7"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">2 - Director</text>
    <text x="60" y="30" fill="#FEE2E2" font-family="sans-serif" font-size="13" font-weight="bold">13.5% (5 / 37)</text>
    <text x="700" y="30" fill="#F87171" font-family="sans-serif" font-size="12">Severe Underrepresentation</text>
  </g>

  <!-- Level 1: Executive Board -->
  <g transform="translate(60, 445)">
    <rect width="830" height="50" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <rect width="103" height="50" rx="6" fill="#DC2626" fill-opacity="0.95"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">1 - Executive (Board &amp; C-Suite)</text>
    <text x="50" y="30" fill="#FEE2E2" font-family="sans-serif" font-size="13" font-weight="bold">12.5% (4 / 32)</text>
    <text x="700" y="30" fill="#F87171" font-family="sans-serif" font-size="12">Board Parity Target: 40%</text>
  </g>

</svg>
