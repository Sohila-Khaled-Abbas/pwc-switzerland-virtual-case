<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="pwcAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D04A02"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <linearGradient id="factCallsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="factChurnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1b18"/>
      <stop offset="100%" stop-color="#181110"/>
    </linearGradient>
    <linearGradient id="factEmpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152e24"/>
      <stop offset="100%" stop-color="#0c1a14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#D04A02"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="1160" height="760" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="40" y="35" width="1120" height="70" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="35" width="8" height="70" rx="4" fill="url(#pwcAccent)"/>
  <text x="65" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">PwC Switzerland | Ralph Kimball Galaxy Architecture</text>
  <text x="65" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">VertiPaq Columnar Tabular Engine • 3 Fact Constellations • 9 Conformed &amp; Auxiliary Dimensions • 0 Many-to-Many Relationships</text>

  <!-- DIMENSION NODES (TOP ROW) -->
  
  <!-- DimDate -->
  <g transform="translate(180, 130)">
    <rect width="200" height="110" rx="8" fill="#131c31" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="200" height="28" rx="8" fill="#1e3a8a"/>
    <text x="15" y="19" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="bold">📅 DimDate (Conformed)</text>
    <text x="15" y="48" fill="#CBD5E1" font-family="monospace" font-size="11">🔑 Date (PK)</text>
    <text x="15" y="66" fill="#94A3B8" font-family="sans-serif" font-size="11">Year • Quarter • Month</text>
    <text x="15" y="84" fill="#94A3B8" font-family="sans-serif" font-size="11">Day_Of_Week • Is_Weekend</text>
    <text x="15" y="100" fill="#64748B" font-family="sans-serif" font-size="9">Granularity: Daily (Q1 2021)</text>
  </g>

  <!-- DimAgent -->
  <g transform="translate(420, 130)">
    <rect width="180" height="110" rx="8" fill="#131c31" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="180" height="28" rx="8" fill="#1e3a8a"/>
    <text x="15" y="19" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="bold">🎧 DimAgent</text>
    <text x="15" y="48" fill="#CBD5E1" font-family="monospace" font-size="11">🔑 Agent (PK)</text>
    <text x="15" y="66" fill="#94A3B8" font-family="sans-serif" font-size="11">Tier (Frontline / Spec)</text>
    <text x="15" y="84" fill="#94A3B8" font-family="sans-serif" font-size="11">Target_CSAT (3.50)</text>
    <text x="15" y="100" fill="#64748B" font-family="sans-serif" font-size="9">Target_Resolution: 85%</text>
  </g>

  <!-- DimTopic -->
  <g transform="translate(630, 130)">
    <rect width="170" height="110" rx="8" fill="#131c31" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="170" height="28" rx="8" fill="#1e3a8a"/>
    <text x="15" y="19" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="bold">🏷️ DimTopic</text>
    <text x="15" y="48" fill="#CBD5E1" font-family="monospace" font-size="11">🔑 Topic (PK)</text>
    <text x="15" y="66" fill="#94A3B8" font-family="sans-serif" font-size="11">Complexity_Weight</text>
    <text x="15" y="84" fill="#94A3B8" font-family="sans-serif" font-size="11">SLA_Threshold_Sec</text>
    <text x="15" y="100" fill="#64748B" font-family="sans-serif" font-size="9">5 Service Domains</text>
  </g>

  <!-- DimContract -->
  <g transform="translate(830, 130)">
    <rect width="180" height="110" rx="8" fill="#131c31" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="180" height="28" rx="8" fill="#1e3a8a"/>
    <text x="15" y="19" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="bold">📝 DimContract</text>
    <text x="15" y="48" fill="#CBD5E1" font-family="monospace" font-size="11">🔑 Contract (PK)</text>
    <text x="15" y="66" fill="#94A3B8" font-family="sans-serif" font-size="11">Commitment_Months</text>
    <text x="15" y="84" fill="#94A3B8" font-family="sans-serif" font-size="11">Risk_Category</text>
    <text x="15" y="100" fill="#64748B" font-family="sans-serif" font-size="9">Elastic vs Locked</text>
  </g>

