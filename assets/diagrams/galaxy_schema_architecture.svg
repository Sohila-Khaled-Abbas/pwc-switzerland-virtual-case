  <!-- Fact_Calls -->
  <g transform="translate(60, 320)">
    <rect width="320" height="230" rx="10" fill="url(#factCallsGrad)" stroke="#38BDF8" stroke-width="2"/>
    <rect width="320" height="34" rx="10" fill="#0369a1"/>
    <text x="15" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">📞 Fact_Calls (5,000 Inquiries)</text>
    <text x="15" y="58" fill="#E2E8F0" font-family="monospace" font-size="11">🔑 Call_Id (PK)</text>
    <text x="15" y="78" fill="#38BDF8" font-family="monospace" font-size="11">🔗 Date (FK ──&gt; DimDate)</text>
    <text x="15" y="98" fill="#38BDF8" font-family="monospace" font-size="11">🔗 Agent (FK ──&gt; DimAgent)</text>
    <text x="15" y="118" fill="#38BDF8" font-family="monospace" font-size="11">🔗 Topic (FK ──&gt; DimTopic)</text>
    <text x="15" y="140" fill="#94A3B8" font-family="sans-serif" font-size="11">📊 Answered (Y/N) • Resolved (Y/N)</text>
    <text x="15" y="160" fill="#94A3B8" font-family="sans-serif" font-size="11">⏱️ Speed_Of_Answer_Sec (Avg: 67.5s)</text>
    <text x="15" y="180" fill="#94A3B8" font-family="sans-serif" font-size="11">⭐ Satisfaction_Rating (Avg: 3.40)</text>
    <text x="15" y="200" fill="#94A3B8" font-family="sans-serif" font-size="11">⌛ Talk_Duration_Sec • Call_Hour</text>
