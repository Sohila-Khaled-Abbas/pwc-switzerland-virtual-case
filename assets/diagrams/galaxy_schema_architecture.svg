    <rect x="15" y="212" width="290" height="2" fill="#431407"/>
  </g>

  <!-- Fact_Employees -->
  <g transform="translate(820, 320)">
    <rect width="320" height="230" rx="10" fill="url(#factEmpGrad)" stroke="#10B981" stroke-width="2"/>
    <rect width="320" height="34" rx="10" fill="#047857"/>
    <text x="15" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">👥 Fact_Employees (500 Personnel)</text>
    <text x="15" y="58" fill="#E2E8F0" font-family="monospace" font-size="11">🔑 Employee ID (PK)</text>
    <text x="15" y="78" fill="#34D399" font-family="monospace" font-size="11">🔗 Department (FK ──&gt; DimDepartment)</text>
    <text x="15" y="98" fill="#34D399" font-family="monospace" font-size="11">🔗 Job Level (FK ──&gt; Dim_CareerLadder)</text>
    <text x="15" y="118" fill="#94A3B8" font-family="sans-serif" font-size="11">⚧ Gender (41% Female | 59% Male)</text>
    <text x="15" y="138" fill="#94A3B8" font-family="sans-serif" font-size="11">📈 Promotion FY21? (51 total, 35.3% F)</text>
    <text x="15" y="158" fill="#94A3B8" font-family="sans-serif" font-size="11">🚪 FY20 leaver? (47 total, 9.4% turnover)</text>
    <text x="15" y="178" fill="#94A3B8" font-family="sans-serif" font-size="11">⭐ FY20 Performance Rating (1 to 4)</text>
    <text x="15" y="200" fill="#94A3B8" font-family="sans-serif" font-size="11">🌍 Nationality • Age • Time in Job Level</text>
    <rect x="15" y="212" width="290" height="2" fill="#064e3b"/>
  </g>

  <!-- AUXILIARY DIMENSIONS (BOTTOM ROW) -->

  <!-- DimDepartment -->
  <g transform="translate(250, 620)">
    <rect width="200" height="120" rx="8" fill="#131c31" stroke="#10b981" stroke-width="1.5"/>
    <rect width="200" height="28" rx="8" fill="#065f46"/>
    <text x="15" y="19" fill="#A7F3D0" font-family="sans-serif" font-size="12" font-weight="bold">🏢 DimDepartment</text>
    <text x="15" y="48" fill="#CBD5E1" font-family="monospace" font-size="11">🔑 Department (PK)</text>
    <text x="15" y="66" fill="#94A3B8" font-family="sans-serif" font-size="11">Executive_Sponsor (COO/CFO)</text>
    <text x="15" y="84" fill="#94A3B8" font-family="sans-serif" font-size="11">Target_Female_Ratio (50%)</text>
    <text x="15" y="104" fill="#64748B" font-family="sans-serif" font-size="9">6 Corporate Business Units</text>
  </g>

  <!-- Dim_CareerLadder -->
  <g transform="translate(480, 620)">
    <rect width="210" height="120" rx="8" fill="#131c31" stroke="#10b981" stroke-width="1.5"/>
    <rect width="210" height="28" rx="8" fill="#065f46"/>
    <text x="15" y="19" fill="#A7F3D0" font-family="sans-serif" font-size="12" font-weight="bold">🪜 Dim_CareerLadder</text>
    <text x="15" y="48" fill="#CBD5E1" font-family="monospace" font-size="11">🔑 Base_Job_Level (PK)</text>
    <text x="15" y="66" fill="#94A3B8" font-family="sans-serif" font-size="11">Target_Promotion_Level</text>
    <text x="15" y="84" fill="#94A3B8" font-family="sans-serif" font-size="11">Progression Track Map</text>
    <text x="15" y="104" fill="#64748B" font-family="sans-serif" font-size="9">Grades: Junior Off -&gt; Exec</text>
  </g>

  <!-- Dim_PRA_Equity -->
  <g transform="translate(720, 620)">
    <rect width="210" height="120" rx="8" fill="#131c31" stroke="#10b981" stroke-width="1.5"/>
    <rect width="210" height="28" rx="8" fill="#065f46"/>
    <text x="15" y="19" fill="#A7F3D0" font-family="sans-serif" font-size="12" font-weight="bold">⚖️ Dim_PRA_Equity</text>
    <text x="15" y="48" fill="#CBD5E1" font-family="monospace" font-size="11">🔑 Department (PK)</text>
    <text x="15" y="66" fill="#94A3B8" font-family="sans-serif" font-size="11">Grade 1..6 PRA Headcount</text>
    <text x="15" y="84" fill="#94A3B8" font-family="sans-serif" font-size="11">Pay &amp; Role Parity Index</text>
    <text x="15" y="104" fill="#64748B" font-family="sans-serif" font-size="9">Swiss Audit Benchmark</text>
