  </g>

  <!-- Fact_Churn -->
  <g transform="translate(440, 320)">
    <rect width="320" height="230" rx="10" fill="url(#factChurnGrad)" stroke="#F97316" stroke-width="2"/>
    <rect width="320" height="34" rx="10" fill="#C2410C"/>
    <text x="15" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">🔄 Fact_Churn (7,043 Accounts)</text>
    <text x="15" y="58" fill="#E2E8F0" font-family="monospace" font-size="11">🔑 customerID (PK)</text>
    <text x="15" y="78" fill="#FB923C" font-family="monospace" font-size="11">🔗 Contract (FK ──&gt; DimContract)</text>
    <text x="15" y="98" fill="#94A3B8" font-family="sans-serif" font-size="11">👥 gender • SeniorCitizen • Partner</text>
    <text x="15" y="118" fill="#94A3B8" font-family="sans-serif" font-size="11">📅 tenure (Months) • Tenure_Cohort</text>
    <text x="15" y="138" fill="#94A3B8" font-family="sans-serif" font-size="11">🌐 InternetService (DSL/Fiber) • TechSupport</text>
    <text x="15" y="158" fill="#94A3B8" font-family="sans-serif" font-size="11">💳 MonthlyCharges ($456K) • TotalCharges</text>
    <text x="15" y="178" fill="#94A3B8" font-family="sans-serif" font-size="11">🎫 numAdminTickets • numTechTickets</text>
