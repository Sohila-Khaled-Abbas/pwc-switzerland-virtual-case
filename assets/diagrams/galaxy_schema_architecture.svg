  <!-- Dim_NationalityCensus -->
  <g transform="translate(960, 620)">
    <rect width="180" height="120" rx="8" fill="#131c31" stroke="#10b981" stroke-width="1.5"/>
    <rect width="180" height="28" rx="8" fill="#065f46"/>
    <text x="15" y="19" fill="#A7F3D0" font-family="sans-serif" font-size="12" font-weight="bold">🌐 Dim_Nationality</text>
    <text x="15" y="48" fill="#CBD5E1" font-family="monospace" font-size="11">🔑 Country_ID (PK)</text>
    <text x="15" y="66" fill="#94A3B8" font-family="sans-serif" font-size="11">Nationality Name</text>
    <text x="15" y="84" fill="#94A3B8" font-family="sans-serif" font-size="11">Census Employee Count</text>
    <text x="15" y="104" fill="#64748B" font-family="sans-serif" font-size="9">23 Represented Nations</text>
  </g>

  <!-- RELATIONSHIP LINES WITH ARROWS -->
  <!-- DimDate to Fact_Calls -->
  <path d="M 230 240 L 230 320" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="235" y="280" fill="#60A5FA" font-size="10" font-family="sans-serif">1 : N</text>

  <!-- DimAgent to Fact_Calls -->
  <path d="M 450 240 L 300 320" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="365" y="275" fill="#60A5FA" font-size="10" font-family="sans-serif">1 : N</text>

  <!-- DimTopic to Fact_Calls -->
  <path d="M 680 240 L 370 320" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="520" y="275" fill="#60A5FA" font-size="10" font-family="sans-serif">1 : N</text>

  <!-- DimContract to Fact_Churn -->
  <path d="M 880 240 L 680 320" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowOrange)"/>
  <text x="770" y="275" fill="#FB923C" font-size="10" font-family="sans-serif">1 : N</text>

  <!-- Fact_Employees to DimDepartment -->
  <path d="M 900 550 L 400 620" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" marker-start="url(#arrow)"/>
  
  <!-- Fact_Employees to Dim_CareerLadder -->
  <path d="M 950 550 L 620 620" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" marker-start="url(#arrow)"/>

  <!-- Fact_Employees to Dim_PRA_Equity -->
  <path d="M 980 550 L 820 620" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" marker-start="url(#arrow)"/>

  <!-- Fact_Employees to Dim_Nationality -->
  <path d="M 1020 550 L 1020 620" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" marker-start="url(#arrow)"/>

</svg>
