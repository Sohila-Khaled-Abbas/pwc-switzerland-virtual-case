name: Vault Quality & Link Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify Frontmatter & Structure
        run: |
          python -c "
          import os, re
          print('Auditing Markdown files...')
          errors = 0
          for root, dirs, files in os.walk('.'):
              if '.obsidian' in root or '.git' in root or '09_Source_Materials' in root:
                  continue
              for f in files:
                  if f.endswith('.md'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8') as mf:
                          content = mf.read()
                      if content.startswith('---'):
                          end_idx = content.find('---', 3)
                          if end_idx == -1:
                              print(f'Unclosed frontmatter in {p}')
                              errors += 1
          print(f'Audit complete with {errors} errors.')
          assert errors == 0
          "
